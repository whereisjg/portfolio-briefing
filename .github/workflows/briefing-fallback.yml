name: Daily Briefing Fallback

on:
  schedule:
    - cron: '12 1 * * 1-5'

permissions:
  actions: write
  contents: read

jobs:
  dispatch-if-needed:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch only when today's ISA order workflow did not start
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          today=$(TZ=Asia/Seoul date +%Y-%m-%d)
          started=$(gh run list --repo "$REPOSITORY" --workflow briefing.yml --limit 20 \
            --json createdAt,displayTitle --jq \
            ".[] | select(.createdAt | startswith(\"${today}\")) | select((.displayTitle // \"\") | contains(\"[isa:orders]\"))")
          if [ -n "$started" ]; then
            echo "Today's ISA order workflow already started."
            exit 0
          fi
          gh workflow run briefing.yml --repo "$REPOSITORY" --ref main \
            -f account_mode=isa -f execute_live_orders=true
