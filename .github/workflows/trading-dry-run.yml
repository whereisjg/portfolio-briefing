name: Trading Dry Run

on:
  schedule:
    - cron: '20 1 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-trading-dry-run
  cancel-in-progress: false

jobs:
  trading-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install requests pytz
      - name: Validate trading configuration
        run: |
          python -m py_compile portfolio_briefing.py trade_automation.py
          python -c "import json; json.load(open('portfolio.json', encoding='utf-8')); json.load(open('trading_config.json', encoding='utf-8'))"
          python -m unittest
      - name: Build trading plan (no orders)
        env:
          KIS_APP_KEY: ${{ secrets.KIS_TEST_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_TEST_APP_SECRET }}
          KIS_ACCOUNT_NO: ${{ secrets.KIS_TEST_ACCOUNT_NO }}
          KIS_PRODUCT_CODE: ${{ secrets.KIS_TEST_PRODUCT_CODE }}
        run: python trade_automation.py
