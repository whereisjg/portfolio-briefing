name: KIS Balance Check

on:
  workflow_dispatch:
    inputs:
      account_mode:
        description: 'KIS account environment'
        required: false
        type: choice
        options:
          - paper
          - live
          - isa
        default: paper
      debug_orderable_cash:
        description: 'Print KIS orderable-cash response fields (read only)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  balance-check:
    runs-on: ubuntu-latest
    env:
      KIS_ACCOUNT_MODE: ${{ inputs.account_mode }}
      KIS_APP_KEY: ${{ inputs.account_mode == 'paper' && secrets.KIS_PAPER_APP_KEY || inputs.account_mode == 'isa' && secrets.KIS_ISA_APP_KEY || secrets.KIS_TEST_APP_KEY }}
      KIS_APP_SECRET: ${{ inputs.account_mode == 'paper' && secrets.KIS_PAPER_APP_SECRET || inputs.account_mode == 'isa' && secrets.KIS_ISA_APP_SECRET || secrets.KIS_TEST_APP_SECRET }}
      KIS_ACCOUNT_NO: ${{ inputs.account_mode == 'paper' && secrets.KIS_PAPER_ACCOUNT_NO || inputs.account_mode == 'isa' && secrets.KIS_ISA_ACCOUNT_NO || secrets.KIS_TEST_ACCOUNT_NO }}
      KIS_PRODUCT_CODE: ${{ inputs.account_mode == 'paper' && secrets.KIS_PAPER_PRODUCT_CODE || inputs.account_mode == 'isa' && secrets.KIS_ISA_PRODUCT_CODE || secrets.KIS_TEST_PRODUCT_CODE }}
      KIS_API_BASE_URL: ${{ inputs.account_mode == 'paper' && 'https://openapivts.koreainvestment.com:29443' || 'https://openapi.koreainvestment.com:9443' }}
      KIS_DEBUG_ORDERABLE_CASH: ${{ inputs.debug_orderable_cash }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install requests pytz
      - name: Configure KIS token cache key
        id: kis-token-key
        run: |
          scope=$(printf %s "$KIS_ACCOUNT_NO" | sha256sum | cut -c1-16)
          echo "prefix=kis-token-v1-${scope}-" >> "$GITHUB_OUTPUT"
          echo "key=kis-token-v1-${scope}-${GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"
      - name: Restore encrypted KIS token cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/kis-access-token.enc
          key: ${{ steps.kis-token-key.outputs.key }}
          restore-keys: |
            ${{ steps.kis-token-key.outputs.prefix }}
      - name: Decrypt cached KIS token
        run: |
          rm -f /tmp/kis-access-token.json /tmp/kis-access-token.json.updated
          if [ -f /tmp/kis-access-token.enc ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -salt \
              -pass env:KIS_APP_SECRET \
              -in /tmp/kis-access-token.enc \
              -out /tmp/kis-access-token.json || rm -f /tmp/kis-access-token.json
          fi
      - name: Query KIS balance (read only)
        env:
          KIS_ACCESS_TOKEN_CACHE_FILE: /tmp/kis-access-token.json
        run: python kis_balance_check.py
      - name: Encrypt newly issued KIS token
        id: seal-kis-token
        if: success()
        run: |
          if [ -f /tmp/kis-access-token.json.updated ]; then
            openssl enc -aes-256-cbc -pbkdf2 -salt \
              -pass env:KIS_APP_SECRET \
              -in /tmp/kis-access-token.json \
              -out /tmp/kis-access-token.enc
            echo "save=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Save encrypted KIS token cache
        if: steps.seal-kis-token.outputs.save == 'true'
        uses: actions/cache/save@v4
        with:
          path: /tmp/kis-access-token.enc
          key: ${{ steps.kis-token-key.outputs.key }}
