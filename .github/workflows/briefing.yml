name: Daily Portfolio Briefing

on:
  workflow_dispatch:
    inputs:
      account_mode:
        description: 'KIS account environment'
        required: false
        type: choice
        options:
          - paper
          - live
        default: paper
      execute_live_orders:
        description: 'Execute the configured live ETF rebalance'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: daily-portfolio-briefing
  cancel-in-progress: false

jobs:
  briefing:
    runs-on: ubuntu-latest
    env:
      KIS_ACCOUNT_MODE: ${{ inputs.account_mode }}
      KIS_APP_KEY: ${{ inputs.account_mode == 'paper' && secrets.KIS_PAPER_APP_KEY || secrets.KIS_TEST_APP_KEY }}
      KIS_APP_SECRET: ${{ inputs.account_mode == 'paper' && secrets.KIS_PAPER_APP_SECRET || secrets.KIS_TEST_APP_SECRET }}
      KIS_ACCOUNT_NO: ${{ inputs.account_mode == 'paper' && secrets.KIS_PAPER_ACCOUNT_NO || secrets.KIS_TEST_ACCOUNT_NO }}
      KIS_PRODUCT_CODE: ${{ inputs.account_mode == 'paper' && secrets.KIS_PAPER_PRODUCT_CODE || secrets.KIS_TEST_PRODUCT_CODE }}
      KIS_API_BASE_URL: ${{ inputs.account_mode == 'paper' && 'https://openapivts.koreainvestment.com:29443' || 'https://openapi.koreainvestment.com:9443' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install requests pytz
      - name: Configure KIS token cache key
        id: kis-token-key
        run: |
          scope=$(printf %s "$KIS_ACCOUNT_NO" | sha256sum | cut -c1-16)
          echo "prefix=kis-token-v1-${scope}-" >> "$GITHUB_OUTPUT"
          echo "key=kis-token-v1-${scope}-${GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"
      - name: Restore encrypted KIS token cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/kis-access-token.enc
          key: ${{ steps.kis-token-key.outputs.key }}
          restore-keys: |
            ${{ steps.kis-token-key.outputs.prefix }}
      - name: Decrypt cached KIS token
        run: |
          rm -f /tmp/kis-access-token.json /tmp/kis-access-token.json.updated
          if [ -f /tmp/kis-access-token.enc ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -salt \
              -pass env:KIS_APP_SECRET \
              -in /tmp/kis-access-token.enc \
              -out /tmp/kis-access-token.json || rm -f /tmp/kis-access-token.json
          fi
      - name: Validate config and script
        run: |
          python -m py_compile portfolio_briefing.py trade_automation.py
          python -c "import json; [json.load(open(path, encoding='utf-8')) for path in ('portfolio.json', 'trading_config.json')]"
          python -m unittest
      - name: Fetch pre-trade KIS balance
        env:
          KIS_BALANCE_ENABLED: 'true'
          KIS_BALANCE_SNAPSHOT_FILE: /tmp/kis-balance.json
          KIS_ACCESS_TOKEN_CACHE_FILE: /tmp/kis-access-token.json
        run: |
          python - <<'PY'
          import portfolio_briefing as briefing

          holdings, summary, _access_token = briefing.fetch_kis_balance()
          briefing.save_kis_balance_snapshot(holdings, summary, _access_token)
          print(f"KIS pre-trade balance snapshot saved: {len(holdings)} holding(s)")
          PY
      - name: Run configured live rebalance
        if: inputs.execute_live_orders == true
        env:
          KIS_BALANCE_SNAPSHOT_FILE: /tmp/kis-balance.json
          KIS_ACCESS_TOKEN_CACHE_FILE: /tmp/kis-access-token.json
          KIS_TREND_STATE_FILE: /tmp/kis-trend-state.json
        run: python trade_automation.py --execute-live > /tmp/trading-plan.txt
      - name: Build trading plan only
        if: inputs.execute_live_orders != true
        env:
          KIS_BALANCE_SNAPSHOT_FILE: /tmp/kis-balance.json
          KIS_ACCESS_TOKEN_CACHE_FILE: /tmp/kis-access-token.json
          KIS_TREND_STATE_FILE: /tmp/kis-trend-state.json
        run: python trade_automation.py > /tmp/trading-plan.txt
      - name: Run post-trade briefing
        env:
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          KIS_BALANCE_ENABLED: 'true'
          KIS_BALANCE_SNAPSHOT_FILE: /tmp/kis-balance.json
          KIS_ACCESS_TOKEN_CACHE_FILE: /tmp/kis-access-token.json
          KIS_TREND_STATE_FILE: /tmp/kis-trend-state.json
          TELEGRAM_MESSAGE_FILE: /tmp/telegram-message.txt
        run: python portfolio_briefing.py
      - name: Add trading plan to Telegram message
        run: |
          printf '\n\n────────────────────\n' >> /tmp/telegram-message.txt
          cat /tmp/trading-plan.txt >> /tmp/telegram-message.txt
      - name: Save trading plan to briefing history
        run: |
          briefing_file="briefings/briefing_$(TZ=Asia/Seoul date +%Y%m%d).md"
          printf '\n\n## 자동매매 실행 결과\n\n```text\n' >> "$briefing_file"
          cat /tmp/trading-plan.txt >> "$briefing_file"
          printf '\n```\n' >> "$briefing_file"
      - name: Commit and push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "Portfolio Bot"
          git config user.email "bot@portfolio.local"
          git add briefings/*.md 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Daily briefing - $(TZ=Asia/Seoul date +%Y-%m-%d)"
          fi
          git pull --rebase origin main
          git push
      - name: Send Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -c "import portfolio_briefing as b; raise SystemExit(0 if b.send_telegram(open('/tmp/telegram-message.txt', encoding='utf-8').read()) else 1)"
      - name: Encrypt newly issued KIS token
        id: seal-kis-token
        if: success()
        run: |
          if [ -f /tmp/kis-access-token.json.updated ]; then
            openssl enc -aes-256-cbc -pbkdf2 -salt \
              -pass env:KIS_APP_SECRET \
              -in /tmp/kis-access-token.json \
              -out /tmp/kis-access-token.enc
            echo "save=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Save encrypted KIS token cache
        if: steps.seal-kis-token.outputs.save == 'true'
        uses: actions/cache/save@v4
        with:
          path: /tmp/kis-access-token.enc
          key: ${{ steps.kis-token-key.outputs.key }}
      - name: Notify failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=⚠️ 포트폴리오 브리핑 GitHub Actions 실패: ${GITHUB_RUN_URL}"
